\r
## Handoff format (your final message, nothing else)\r
\r
```\r
PACKET: <name>  BRANCH: <branch>  TIP: <sha>  PUSHED: yes/no\r
BUILT: <item>: done | partial (<what remains>) | not built (<why>)   (one line per item)\r
DEVIATIONS: <where the code disagreed with the packet, and what you did instead>\r
ASK-FIRST: <questions you stopped on, or "none">\r
PROOF: pytest <passed>/<failed> exit <code> (lock free: yes/no) · ruff <clean/N> · smoke <n/7> · selftest <n/n>\r
PACKAGING TRIGGER: none | <which>\r
GATES: <the live gate(s) you recorded, one line each>\r
NEXT: <the single most useful thing the lead should verify first>\r
```\r
\r
Keep chat output between steps to one or two lines. Detail lives in commits and docs."""
