5. File-scoped ask-first: `scripts/master_avwap_lib/legacy.py`,\r
   `scripts/bounce_bot_lib/*`, `scripts/m5_signal_engines.py` and any file housing\r
   detector/scoring/alert code. If the packet quotes the trader's decision for the\r
