2. Line numbers in a packet were read on the date the packet says. Verify each before\r
   editing. If the code disagrees with the packet, the code is the fact: report the\r
   difference in the handoff and do not force the change.\r
3. Every behaviour change ships with a test PROVEN to fail on the un-fixed code: stash\r
   or restore the pre-change file, run the test, see it fail, restore, run again. Say\r
   so in the commit message.\r
4. Hard invariants (plan.md sec 5) bind you: decision-support only; nothing you build\r
   may reach a detector, score, gate, alert, watchlist, Focus list, review queue or\r
   `review_policy.json` unless the packet names exactly that change; golden fixtures\r
