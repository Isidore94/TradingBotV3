  Commit small and green; `git push -u origin Codex/<packet-slug>` after each commit.\r
- Python is `C:\\Users\\Aaron\\TradingBotV3\\.venv\\Scripts\\python.exe` (absolute path; the\r
  worktree has no venv of its own). Qt tests need `QT_QPA_PLATFORM=offscreen`.\r
- Live stores (`C:\\TradingBotData`, `%LOCALAPPDATA%\\TradingBotV3`,\r
  `\\\\MINI-PC\\Trading Bot Data`) are READ-ONLY to you unless the packet names a write.\r
  Copy a file to a temp path before any reproduction that writes.\r
\r
## House rules (every packet, no exceptions)\r
\r
1. Follow `AGENTS.md`'s mandatory documentation workflow before the first edit: the\r
   "Active state at a glance" block in `CURRENT_CHECKPOINT.md`, `plan.md` sections\r
   5/6/7 and the phase you are in, and SEARCH `CHANGELOG.md`'s "Current implemented\r
