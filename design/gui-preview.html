  background-repeat: no-repeat;

  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

    &quot;message&quot;,
    (event) =&gt; {

      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);

        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1

        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();

              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;

    }

    if (event.target instanceof globalThis.Element) {

      return;
    }

        id = decodeURIComponent(href.slice(1));

    const heading=(n,title,sub,action=&#x27;&#x27;)=&gt;`&lt;div class=&quot;tb-header&quot;&gt;&lt;div&gt;&lt;div class=&quot;tb-kicker&quot;&gt;${n}&lt;/div&gt;&lt;h1&gt;${title}&lt;/h1&gt;&lt;p class=&quot;tb-sub&quot;&gt;${sub}&lt;/p&gt;&lt;/div&gt;${action}&lt;/div&gt;`;

t;${symbol} &lt;span class=&quot;tb-sub tb-small&quot;&gt;${s.side} · D1&lt;/span&gt;&lt;/h2&gt;&lt;/div&gt;&lt;span class=&quot;tb-grow&quot;&gt;&lt;/span&gt;&lt;span class=&quot;tb-numeric&quot;&gt;${s.price} &lt;span class=&quot;tb-small tb-sub&quot;&gt;USD · example&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;${chart()}&lt;div class=&quot;tb-note&quot;&gt;&lt;b&gt;${s.setup}&lt;/b&gt;&lt;p class=&quot;tb-sub&quot;&gt;${s.note}&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;tb-flex&quot;&gt;&lt;button type=&quot;button&quot; data-demo=&quot;Focus is an explicit action. This sketch changes no live list.&quot; class=&quot;tb-main-action&quot;&gt;Add to Focus&lt;/button&gt;&lt;button type=&quot;button&quot; data-demo=&quot;The selected name&#x27;s notes would open here.&quot;&gt;Notes&lt;/button&gt;&lt;button type=&quot;button&quot; data-demo=&quot;The existing price-alert controls would open here.&quot;&gt;Price alert&lt;/button&gt;&lt;/div&gt;${disclosure(&#x27;Chart controls and full setup fields&#x27;,&#x27;All existing indicators, levels, annotations, timeframes, setup columns and capture actions stay available. A row click never adds a name to Focus.&#x27;)}&lt;/section&gt;&lt;aside class=&quot;tb-pane&quot; data-evidence&gt;&lt;div class=&quot;tb-kicker&quot;&gt;Understand&lt;/div&gt;&lt;h2&gt;Why this name?&lt;/h2&gt;&lt;dl class=&quot;tb-evidence&quot;&gt;&lt;dt&gt;Setup&lt;/dt&gt;&lt;dd&gt;${s.setup}&lt;/dd&gt;&lt;dt&gt;Source&lt;/dt&gt;&lt;dd&gt;D1 scan&lt;/dd&gt;&lt;dt&gt;Scope&lt;/dt&gt;&lt;dd&gt;Swing&lt;/dd&gt;&lt;dt&gt;Coverage&lt;/dt&gt;&lt;dd&gt;Shown with result&lt;/dd&gt;&lt;/dl&gt;${disclosure(&#x27;Exact evidence&#x27;,&#x27;The production inspector shows source timestamp, measured sample, known gaps and the existing setup rationale. No new score is created.&#x27;)}&lt;hr class=&quot;tb-rule&quot;&gt;&lt;h2&gt;Movers&lt;/h2&gt;&lt;p class=&quot;tb-sub tb-small&quot;&gt;Pop + Dip and My names stay visible here. No duplicate scanner.&lt;/p&gt;&lt;div class=&quot;tb-observation&quot;&gt;&lt;b&gt;MSFT&lt;/b&gt;&lt;span class=&quot;tb-sub tb-small&quot;&gt; · example row&lt;/span&gt;&lt;p class=&quot;tb-small&quot;&gt;Move, RVOL and level in one line.&lt;/p&gt;&lt;/div&gt;&lt;h3&gt;Trade Mentor&lt;/h3&gt;&lt;p class=&quot;tb-sub tb-small&quot;&gt;One current prompt, with the full conversation one click away.&lt;/p&gt;&lt;/aside&gt;&lt;/div&gt;`}
